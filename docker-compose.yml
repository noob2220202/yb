services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yb
      POSTGRES_PASSWORD: yb
      POSTGRES_DB: yb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "7001:7001"
    environment:
      DATABASE_URL: postgresql+asyncpg://yb:yb@postgres:5432/yb
      PINNACLE_BASE_URL: https://api.pinnacle.com
      PINNACLE_USERNAME: ${PINNACLE_USERNAME:-}
      PINNACLE_PASSWORD: ${PINNACLE_PASSWORD:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_API_BASE_URL: https://api.the-odds-api.com
      ODDS_API_SPORT_KEYS: ${ODDS_API_SPORT_KEYS:-soccer_epl}
      POLL_SPORTS: ${POLL_SPORTS:-soccer}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      API_KEYS: ${API_KEYS:-dev-local-key}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MIN_MARGIN_PERCENT: ${TELEGRAM_MIN_MARGIN_PERCENT:-1.0}
      TELEGRAM_MIN_EDGE_PERCENT: ${TELEGRAM_MIN_EDGE_PERCENT:-3.0}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:7001
        NEXT_PUBLIC_API_KEY: ${API_KEYS:-dev-local-key}
    ports:
      - "7000:7000"
    depends_on:
      - backend

volumes:
  postgres-data:
